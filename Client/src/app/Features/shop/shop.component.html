@if(products){

 <div class="flex flex-col gap-3">

    <!-- Top buttons -->
    <div class="flex justify-between gap-3">
        <mat-paginator
        (page)="handlePageEvent($event)"
        [length]="products.count"
        [pageSize]="shopParams.pageSize"
        [showFirstLastButtons]="true"
        [pageSizeOptions]="pageSizeOptions"
        [pageIndex]="shopParams.pageNumber-1"
        aria-label="Product pagination"
        
        >
        </mat-paginator>

        <form 
        #searchForm="ngForm" 
        (ngSubmit)=" onSerachChange()"
        class="relative flex items-center w-full max-w-md mx-4"
        >
        <input type="search"
         class="block w-full p-3 text-sm text-gray-900 border border-gray-300 rounded-lg "
         placeholder="Search"
         name="search"
         [(ngModel)]="shopParams.search"

        />
        <button mat-icon-button type="submit" 
        class="w-full h-14 px-4 pr-12 text-sm text-gray-900 border border-gray-300 rounded-lg"
        >

        <mat-icon>search</mat-icon>
        </button>

        </form>

        <div class="flex gap-3">

        <!-- Filters button -->
        <button class="match-input-height"
            mat-stroked-button
            (click)="openFiltersDialog()">

            <mat-icon>filter_list</mat-icon>

            Filters

        </button>


        <!-- Sort button -->
        <button class="match-input-height"
            mat-stroked-button
            [matMenuTriggerFor]="sortMenu">

            <mat-icon>swap_vert</mat-icon>

            Sort

        </button>
        </div>

    </div>


    <!-- Products -->
    <div class="grid grid-cols-4 gap-4">

        @for (product of products?.data; track product.id) {

            <app-product-item
                [product]="product">
            </app-product-item>

        }

    </div>

</div>



<!-- Sort Menu -->
<mat-menu #sortMenu="matMenu">

    <!-- Alphabetical -->
    <button
        mat-menu-item
        (click)="onSortChange('name')">

        Alphabetical

    </button>


    <!-- Price Low to High -->
    <button
        mat-menu-item
        (click)="onSortChange('priceAsc')">

        Price Low to High

    </button>


    <!-- Price High to Low -->
    <button
        mat-menu-item
        (click)="onSortChange('priceDesc')">

        Price High to Low

    </button>

</mat-menu>
}
